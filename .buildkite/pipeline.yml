# The repository's configured bootstrap uploads this exact path with groqkite.
# Validation/preflight remain usable while automation is disabled. Candidate
# builds require a new UI build on main, an explicit block, and the live gate.
steps:
  - label: ":python: Validate Groq Talos release tooling"
    key: groq-release-validation
    timeout_in_minutes: 15
    env:
      GROQ_SKIP_HERMIT_INSTALL: "true"
      GROQ_SKIP_MISE_INSTALL: "true"
    command: mise exec python@3.12.11 -- bash groq/check.sh

  - label: ":mag: Talos builder preflight (no image build)"
    key: groq-talos-preflight
    depends_on: groq-release-validation
    agents:
      queue: large
    # Override only this job, not the queue. No embedded Groq credential broker.
    image: &talos_agent docker.io/library/python:3.12.11-bookworm@sha256:1b48a1b13ec678be8d84974541cc007d4367aaf01f985231daad1a940106efc0
    timeout_in_minutes: 10
    env: &talos_env
      GROQ_SKIP_HERMIT_INSTALL: "true"
      GROQ_SKIP_MISE_INSTALL: "true"
    command: python3 groq/buildkite_runner.py preflight

  - block: "Approve unqualified Talos candidate"
    key: groq-talos-approval
    depends_on: groq-talos-preflight
    if: &candidate_request >-
      build.branch == "main" && build.source == "ui" &&
      build.pull_request.id == null && build.tag == null &&
      build.env("GROQ_TALOS_BUILD") == "candidate"
    prompt: >-
      Confirm the exact main commit, reviewed runner/secret isolation, and live
      enabled policy. Build only: no registry publication or production upgrade.

  - label: ":package: Build unqualified Talos candidate"
    key: groq-talos-candidate
    depends_on: groq-talos-approval
    if: *candidate_request
    agents:
      queue: large
    image: *talos_agent
    env: *talos_env
    timeout_in_minutes: 120
    concurrency: 1
    concurrency_group: groq/siderolabs-talos/candidate
    retry:
      automatic: false
      manual:
        allowed: false
    # No artifact_paths: publication must pass the original live policy receipt.
    command: python3 groq/buildkite_runner.py candidate
