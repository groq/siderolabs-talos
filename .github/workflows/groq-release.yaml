name: groq talos release

on:
  pull_request:
    paths:
      - groq/**
      - .buildkite/pipeline.yml
      - .github/workflows/groq-release.yaml
  push:
    branches: [main]
    paths:
      - groq/**
      - .buildkite/pipeline.yml
      - .github/workflows/groq-release.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: groq-talos-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate tooling, kill switch, and exact upstream patch application
        run: bash groq/check.sh
