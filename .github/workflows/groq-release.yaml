name: groq talos release

on:
  pull_request:
    paths:
      - groq/**
      - .buildkite/pipeline.yml
      - .github/workflows/groq-release.yaml
  push:
    branches: [main]
    paths:
      - groq/**
      - .buildkite/pipeline.yml
      - .github/workflows/groq-release.yaml
  workflow_dispatch:
    inputs:
      build_candidate:
        description: Build an unqualified candidate (also requires the live global switch)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: groq-talos-${{ github.event_name == 'workflow_dispatch' && 'candidate' || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Validate tooling, kill switch, and exact upstream patch application
        run: bash groq/check.sh

  candidate:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.build_candidate
    # A dedicated build runner is a CI resource, not a new hardware test lab.
    # Provision this label with Linux amd64, Docker/BuildKit and >=40 GiB free.
    runs-on: [self-hosted, linux, x64, groq-talos-builder]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check live global kill switch before builder setup
        run: python3 groq/release.py gate
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure
      - name: Build candidate with continuous kill-switch checks
        run: python3 groq/release.py build --workspace "$RUNNER_TEMP/talos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Recheck original policy before uploading candidate artifacts
        run: >-
          python3 groq/release.py gate
          --manifest "$RUNNER_TEMP/talos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/artifacts/manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: talos-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/talos-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
